# OASIS Docker lab. Stage A: gateway, attacker, victim.
# Stage B: sensor, detector, responder (least privilege, shared data volume).
# Stage C: explainer, specialist (LLM agents on the mgmt network).
# Dashboard: read-only web view on 127.0.0.1:8080.
name: oasis

x-core: &core
  build:
    context: .
    dockerfile: docker/core/Dockerfile
  image: oasis/core:dev
  init: true
  cap_drop: [ALL]
  volumes:
    - oasis-data:/app/data

# LLM agents: only on mgmt (internet, no lab access), keys from .env at runtime.
x-agent: &agent
  build:
    context: .
    dockerfile: docker/agents/Dockerfile
  image: oasis/agents:dev
  init: true
  cap_drop: [ALL]
  restart: on-failure   # e.g. started before responder created the events table
  volumes:
    - oasis-data:/app/data
  env_file:
    - path: .env
      required: false   # no .env: explainer/specialist fall back to templates
  networks: [mgmt]
  depends_on: [responder]

services:
  gateway:
    build:
      context: ./docker
      dockerfile: gateway/Dockerfile
    image: oasis/gateway:dev
    hostname: oasis-gw
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      OASIS_GW_IPS: "10.10.1.254 10.10.2.254"
    # Also covers sensor and responder, which share this network namespace.
    dns: [10.10.1.254]   # no DNS server there: external names fail (no DNS leak)
    networks:
      attacker-net:
        ipv4_address: 10.10.1.254
      victim-net:
        ipv4_address: 10.10.2.254

  victim:
    build:
      context: ./docker
      dockerfile: victim/Dockerfile
    image: oasis/victim:dev
    init: true
    cap_add: [NET_ADMIN]
    environment:
      OASIS_GW: 10.10.2.254
    dns: [10.10.2.254]   # no DNS server there: external names fail (no DNS leak)
    networks:
      victim-net:
        ipv4_address: 10.10.2.10
    depends_on: [gateway]

  # No fixed IP: --scale attacker=N takes addresses from ip_range.
  attacker:
    build:
      context: ./docker
      dockerfile: attacker/Dockerfile
    image: oasis/attacker:dev
    init: true
    cap_add: [NET_ADMIN, NET_RAW]
    environment:
      OASIS_GW: 10.10.1.254
    dns: [10.10.1.254]   # no DNS server there: external names fail (no DNS leak)
    networks: [attacker-net]
    depends_on: [gateway]

  # Sniffs the gateway's attacker-side interface (found from OASIS_GW_IP).
  sensor:
    <<: *core
    command: ["python3", "src/sensor.py"]
    network_mode: "service:gateway"
    cap_add: [NET_RAW]
    environment:
      OASIS_GW_IP: 10.10.1.254
      OASIS_SRC_NET: 10.10.1.0/24
      OASIS_SENSOR_IGNORE: "10.10.1.1,10.10.1.254"
      OASIS_SENSOR_DNS_SERVER: 10.10.1.254   # attackers' DNS (see dns: above)
    depends_on: [gateway]

  # Only reads and writes files: no network, no capabilities.
  detector:
    <<: *core
    command: ["sh", "-c", "touch data/windows.jsonl data/alerts.jsonl && exec python3 src/detector.py"]
    network_mode: none
    environment: &whitelist
      OASIS_WHITELIST: "10.10.1.1,10.10.1.254,10.10.2.1,10.10.2.254,10.10.2.10"

  # Writes nft rules into the gateway's network namespace.
  responder:
    <<: *core
    command: ["python3", "src/responder.py", "--enforce"]
    network_mode: "service:gateway"
    cap_add: [NET_ADMIN]
    environment: *whitelist
    depends_on: [gateway, detector]

  explainer:
    <<: *agent
    command: ["python", "src/explainer.py", "--watch"]

  specialist:
    <<: *agent
    command: ["python", "src/specialist.py", "--watch"]

  # Read-only web view of oasis.db. No capabilities, no writes, no lab or mgmt access.
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard/Dockerfile
    image: oasis/dashboard:dev
    init: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    user: "65534:65534"
    volumes:
      - oasis-data:/app/data:ro
    environment:
      OASIS_DASH_BIND: 0.0.0.0                            # inside the container only
      OASIS_DASH_HOSTS: "127.0.0.1:8080,localhost:8080"   # Host header allowlist
    ports:
      - "127.0.0.1:8080:8080"                             # host loopback only
    networks: [dash]

# Not "internal": Docker would then drop routed traffic between the subnets.
# The lab stays offline instead by: no NAT here, no default route and the
# lab_isolation table on the gateway. Packages are installed at build time.
networks:
  attacker-net:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.10.1.0/24
          ip_range: 10.10.1.64/26   # auto addresses .64-.127
  victim-net:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.10.2.0/24
  # The only network with internet access (NAT on), for LLM API calls.
  mgmt:
    ipam:
      config:
        - subnet: 10.10.9.0/24
  # Dashboard only. Not "internal": Docker publishes no ports on internal networks.
  dash:
    ipam:
      config:
        - subnet: 10.10.8.0/24

volumes:
  oasis-data:
